<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Marrom e Branco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="counter-card">
            <h1 class="title">Contador</h1>
            <div class="counter-display">
                <span id="counter-value">0</span>
            </div>
            <div class="controls">
                <button class="btn btn-decrease" id="decrease-btn">-</button>
                <button class="btn btn-reset" id="reset-btn">Reset</button>
                <button class="btn btn-increase" id="increase-btn">+</button>
            </div>
            <div class="additional-controls">
                <button class="btn btn-step" id="step-5">+5</button>
                <button class="btn btn-step" id="step-10">+10</button>
                <button class="btn btn-step" id="step-100">+100</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
